---
name: Build

on:
  pull_request:
  push:

permissions: {}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install SDL3
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz
          tar -xzf SDL3-${SDL3_VERSION}.tar.gz
          mv SDL3-${SDL3_VERSION} SDL3
          cd SDL3
          cmake -DCMAKE_INSTALL_PREFIX="`pwd`/prefix" -DSDL_UNIX_CONSOLE_BUILD=ON .
          make -j2 install
      - name: Build Stella
        run: |
          CXXFLAGS="-I `pwd`/SDL3/prefix/include -O2 -g" PKG_CONFIG_PATH="`pwd`/SDL3/prefix/lib/pkgconfig/" ./configure
          make -j2 all

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26'
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install SDL3
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.dmg
          hdiutil attach SDL3-${SDL3_VERSION}.dmg
          mkdir -p src/os/macos/Frameworks
          cp -Rv /Volumes/SDL3/SDL3.xcframework src/os/macos/Frameworks
          hdiutil detach /Volumes/SDL3
      - name: Build Stella
        run: |
          cd src/os/macos
          xcodebuild

  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]
    env:
      Platform: ${{ matrix.platform }}
      SDL3_version: 3.4.18
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up MSBUILD
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - name: Install SDL3
        shell: cmd
        run: |
          curl -fL --retry 5 --retry-all-errors -o "C:\SDL3-devel.zip" "https://github.com/libsdl-org/SDL/releases/download/release-%SDL3_version%/SDL3-devel-%SDL3_version%-VC.zip" || exit /b 1
          7z x "C:\SDL3-devel.zip" -o"C:\" || exit /b 1
          xcopy /S "C:\SDL3-%SDL3_version%\include" src\common
          if %Platform%==x64 xcopy /S "C:\SDL3-%SDL3_version%\lib\x64" src\os\windows

      - name: Build Stella
        run: |
          msbuild src\os\windows\Stella.sln
